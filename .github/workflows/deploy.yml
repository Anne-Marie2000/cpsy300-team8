name: Build and deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: acrcpsy300team84821
  RESOURCE_GROUP: rg-cpsy300-project-team8
  CONTAINERAPP: ca-recipes-team8

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to the registry
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build
        run: docker build -t ${{ env.ACR_NAME }}.azurecr.io/recipes:${{ github.sha }} .

      - name: Push
        run: docker push ${{ env.ACR_NAME }}.azurecr.io/recipes:${{ github.sha }}

      - name: Deploy
        run: az containerapp update --name ${{ env.CONTAINERAPP }} --resource-group ${{ env.RESOURCE_GROUP }} --image ${{ env.ACR_NAME }}.azurecr.io/recipes:${{ github.sha }}